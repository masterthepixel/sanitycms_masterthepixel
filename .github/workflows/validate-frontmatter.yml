name: "Frontmatter parity (PR)"

on:
  pull_request:
    branches: [ main, migrate/cloudflare ]

jobs:
  validate-frontmatter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run frontmatter parity check
        run: bun run validate:frontmatter

      - name: Run image path validation
        run: bun run validate:images

  playwright-e2e:
    runs-on: ubuntu-latest
    needs: validate-frontmatter
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bun run test:e2e:install
      - name: Run Playwright E2E tests
        run: bun run test:e2e
        env:
          CI: true
